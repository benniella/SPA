# Alembic configuration for SPA.
#
# The database URL is NOT stored here: it is read from the environment through
# 'app.core.config.Settings', so credentials never live in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamp-prefixed revision files sort chronologically in the repository,
# which makes a long migration history readable without opening every file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Emit migrations with type annotations, keeping them consistent with the app.
revision_environment = true

[post_write_hooks]
# Format every generated migration with the same Ruff configuration as the app,
# so 'alembic revision --autogenerate' output is review-ready.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = .venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S