# SPA — local development infrastructure.
#
# Deliberately minimal: only infrastructure that genuinely benefits from
# containerisation is defined here. The FastAPI app, the worker and the Next.js
# app run natively on the host so that hot reload and debugging stay simple.

name: spa

services:
  postgres:
    image: postgres:16-alpine
    container_name: spa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa}
      POSTGRES_DB: ${POSTGRES_DB:-spa}
      # Deterministic collation keeps index ordering stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host port is overridable because 5432 is frequently already taken by
      # other local Postgres instances. Keep DATABASE_URL in backend/.env in
      # sync with this value.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spa} -d ${POSTGRES_DB:-spa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # KeyDB holds ephemeral state only: the job queue and the realtime event
  # fan-out. PostgreSQL remains the source of truth for every job; KeyDB is a
  # notification channel that may be flushed without losing durable work.
  keydb:
    image: eqalpha/keydb:latest
    container_name: spa-keydb
    restart: unless-stopped
    command: keydb-server --save "" --appendonly no
    ports:
      - "${KEYDB_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spa-postgres-data: