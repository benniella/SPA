name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Cancel a superseded run. Without this, pushing twice in quick succession leaves
# the first run burning minutes on a commit that is already out of date.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The integration tests run against real PostgreSQL on purpose: the
        # schema depends on JSONB, check constraints and ON DELETE semantics that
        # a substitute database would not reproduce.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spa
          POSTGRES_PASSWORD: spa
          POSTGRES_DB: spa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spa -d spa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPA_TEST_DATABASE_URL: postgresql+psycopg://spa:spa@localhost:5432/spa_test
      SPA_ENVIRONMENT: local

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migrations are reversible
        # A downgrade that fails is a migration that cannot be rolled back in an
        # incident. Checking it here is far cheaper than discovering it later.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify autogenerate detects no schema drift
        # If 'alembic revision --autogenerate' produces a non-empty migration, the
        # models and the migrations have diverged. Failing here means the drift is
        # caught in review instead of by whoever deploys next.
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id driftcheck
          if grep -qE "op\.(create|drop|add|alter)" migrations/versions/*driftcheck*.py; then
            echo "::error::Schema drift detected — models and migrations disagree."
            cat migrations/versions/*driftcheck*.py
            exit 1
          fi
          rm -f migrations/versions/*driftcheck*.py

      - name: Run tests
        # Unit and integration tests both run: the integration suite is the only
        # thing that verifies the SQL, the constraints and tenancy scoping.
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
